name: Metrics

on:
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # METRICS_TOKEN is a classic PAT with `repo` + `read:user`, so private
      # repos count toward commits and languages. Only aggregates are rendered.
      # Falls back to GITHUB_TOKEN (public data only) if the secret is unset.
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          output_action: commit
          committer_message: "chore: update metrics"

          template: classic
          config_timezone: America/New_York
          config_octicon: yes
          # community/repositories omitted: they render as rows of zeros
          # (sponsors, releases, stargazers) for someone whose work is private.
          base: header, activity
          base_indepth: yes
          repositories_affiliations: owner
          repositories_forks: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_days: 30

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
